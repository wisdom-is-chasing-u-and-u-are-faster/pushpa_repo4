<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Next-Generation Digital Banking</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
    <header class="navbar">
        <a href="/" class="navbar-brand">Apex Digital Banking</a>
        <nav>
            <ul class="navbar-nav">
                <li><a href="/pages/onboarding.html" class="nav-link">New Customer? Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 440px; padding: 32px;">
            <div style="text-align: center; margin-bottom: 24px;">
                <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 6px;">Sign In to Your Account</h1>
                <p style="color: var(--c-text-secondary); font-size: 0.875rem;">FAPI OAuth 2.1 Secured Banking Gateway</p>
            </div>

            <div id="login-alert" class="alert" style="display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email or Corporate Username</label>
                    <input type="email" id="login-email" class="form-control" value="alex.mercer@apexbank.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password / Passcode</label>
                    <input type="password" id="login-password" class="form-control" value="••••••••••••" required>
                </div>
                <div class="form-group">
                    <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block">Sign In</button>
                </div>
                <div style="text-align: center; margin: 16px 0; font-size: 0.8125rem; color: var(--c-text-secondary);">— OR BIOMETRIC TOKEN —</div>
                <button type="button" id="btn-biometric-login" class="btn btn-secondary btn-block">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 11c1.66 0 3-1.34 3-3V5a3 3 0 0 0-6 0v3c0 1.66 1.34 3 3 3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    Authenticate with FAPI Biometric Token
                </button>
            </form>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const alertBox = document.getElementById('login-alert');
            try {
                const res = await BankingAPI.login(email);
                alertBox.className = 'alert alert-success';
                alertBox.style.display = 'block';
                alertBox.innerHTML = `Authenticated as <strong>${res.user.name}</strong>. Redirecting...`;
                setTimeout(() => window.location.href = '/pages/accounts-dashboard.html', 800);
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.style.display = 'block';
                alertBox.innerText = 'Login failed.';
            }
        });

        document.getElementById('btn-biometric-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const res = await BankingAPI.login(email, null, 'bio_fapi_jwt_mock');
            window.location.href = '/pages/accounts-dashboard.html';
        });
    </script>
</body>
</html>
